services:
  db:
    image: mongo:8
    container_name: db
    restart: unless-stopped
    command:
      - mongod
      - --replSet
      - rs0
      - --bind_ip_all
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mongosh --quiet --eval "try { rs.status() } catch (e) { rs.initiate({_id:''rs0'',members:[{_id:0,host:''db:27017''}]}) }"',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: server
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./server/.env
    depends_on:
      db:
        condition: service_healthy
volumes:
  mongo_data:
